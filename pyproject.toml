[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "honba"
version = "0.1.0"
description = "本場 honba — Rust core, Python surface, Indian equities algo trading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "honba-labs" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "typer>=0.12",
    "rich>=13.0",
    "yfinance>=0.2",
    "duckdb>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
honba = "honba.cli.main:app"

[project.optional-dependencies]
# cryptography is also pulled in by `dev` below; it backs honba.adapters.secrets (encrypted
# broker credential storage), which several adapters (e.g. dhan) import unconditionally.
adapters = ["cryptography>=42.0"]
# Heavy/optional subsystems bulk-imported from honba-labs (honba.ai.*, honba.ai.rl,
# honba.ai.alignment, honba.ai.llm) stay opt-in extras, never forced on every consumer.
ai = ["openai>=1.0", "anthropic>=0.30", "litellm>=1.40", "mcp>=1.0"]
alignment = ["peft>=0.10", "bitsandbytes>=0.43", "transformers>=4.38", "accelerate>=0.27"]
llm = ["llama-cpp-python>=0.2.90"]
rl = ["torch>=2.2", "gymnasium>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "cryptography>=42.0"]

[tool.maturin]
module-name = "honba._honba"
python-source = "python"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
