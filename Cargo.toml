[workspace]
resolver = "2"
members = [
  "crates/honba-tamashii-codegen",
  "crates/honba-tamashii-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-tamashii"

[workspace.dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310", "chrono"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
async-trait = "0.1"
schemars = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }

honba-tamashii-codegen = { path = "crates/honba-tamashii-codegen" }
honba-tamashii-py      = { path = "crates/honba-tamashii-py" }

honba-codegen          = { package = "honba-tamashii-codegen", path = "crates/honba-tamashii-codegen" }
honba-py               = { package = "honba-tamashii-py", path = "crates/honba-tamashii-py" }

# Cross-repo dependencies: the canonical foundation this bridge speaks.
honba-core       = { path = "../honba-core" }
honba-mon        = { path = "../honba-mon" }
honba-me-market  = { path = "../honba-me/crates/honba-me-market" }
