[package]
name = "honba-tamashii"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
description = "本場・魂 — PyO3 bindings for the honba engine"

[lib]
name = "_honba"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
rust_decimal = "1"
