name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        target-platform: ["linux-x86_64", "linux-aarch64"]
        include:
          - python-version: "3.10"
            target-platform: "linux-x86_64"
          - python-version: "3.10"
            target-platform: "linux-aarch64"
          - python-version: "3.11"
            target-platform: "linux-x86_64"
          - python-version: "3.11"
            target-platform: "linux-aarch64"
          - python-version: "3.12"
            target-platform: "linux-x86_64"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin and dependencies
        run: |
          pip install maturin
          pip install -e .
      - name: Build and test
        run: |
          maturin develop
          pip install pytest ruff
          python -m pytest -q
