[package]
name = "honba-tamashii-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 bindings and honba._honba extension module"

[lib]
# The extension is installed as `honba._honba`; the library name is the module
# name maturin expects.
name = "_honba"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (`features = ["extension-module"]`); without it the crate
# links libpython, which is what `cargo test` needs.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
tokio.workspace = true
honba-core.workspace = true
honba-mon.workspace = true
honba-me-market.workspace = true
honba-me-feed.workspace = true
honba-me-loaders.workspace = true
honba-me-indicators.workspace = true
honba-codegen.workspace = true
arrow.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
serde_json.workspace = true
